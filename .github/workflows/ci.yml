name: LifeOS Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: "true"

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest backend/tests -c backend/pytest.ini -v --cov=backend
        env:
          PYTHONPATH: .

      - name: Run Pip Audit Security Scan
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend-build:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile || npm install --legacy-peer-deps

      - name: Run ESLint
        run: |
          npx eslint src --quiet

      - name: Run Frontend Tests
        run: |
          npm test -- --watchAll=false --coverage

      - name: Build Production Assets
        run: |
          npm run build
        env:
          CI: false
          REACT_APP_BACKEND_URL: http://localhost:8000
